# ==============================================
# H2 IN-MEMORY DATABASE CONFIGURATION
# ==============================================
spring.datasource.url=jdbc:h2:mem:shoppingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ==============================================
# JPA & HIBERNATE CONFIGURATION FOR H2
# ==============================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==============================================
# DATA INITIALIZATION (Fixes data.sql timing)
# ==============================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==============================================
# H2 WEB CONSOLE (Optional: lets you view your DB in the browser)
# ==============================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================
# SERVER CONFIGURATION
# ==============================================
server.port=8080


app.shop.default-location=LONDON